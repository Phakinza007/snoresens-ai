name: Build iPhone app (unsigned)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ios:
    runs-on: xcode-27
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install pinned Flutter SDK
        run: |
          git clone --depth 1 --branch 3.50.0 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter-sdk"
          echo "$RUNNER_TEMP/flutter-sdk/bin" >> "$GITHUB_PATH"
      - name: Show toolchain
        run: |
          flutter --version
          xcodebuild -version
          pod --version
      - name: Resolve dependencies
        run: flutter pub get
      - name: Analyze and test
        run: |
          flutter analyze
          flutter test --reporter expanded
      - name: Build native iOS app without signing
        run: flutter build ios --release --no-codesign
      - name: Package unsigned IPA
        run: |
          mkdir -p build/unsigned/Payload
          ditto build/ios/iphoneos/Runner.app build/unsigned/Payload/Runner.app
          cd build/unsigned
          zip -q -r Snoresens-AI-unsigned.ipa Payload
      - uses: actions/upload-artifact@v7
        with:
          name: SnoresensAI-iOS-unsigned
          path: mobile/build/unsigned/Snoresens-AI-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
